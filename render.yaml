services:
  - type: web
    name: f1-intelligence-api
    runtime: python
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    disk:
      name: f1-race-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: SERVICE_API_KEY
        sync: false
      - key: RAG_NAMESPACE
        value: historical-v2
      - key: PINECONE_ENVIRONMENT
        value: us-east-1
      - key: FASTF1_CACHE_DIR
        value: /var/data/fastf1_cache
      - key: DATA_DIR
        value: /var/data
      - key: JOB_DB_PATH
        value: /var/data/jobs.sqlite3
      - key: LIVE_OUTPUT_DIR
        value: /var/data/spark_output/live
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: FRONTEND_URL
        value: https://f1-race-intelligence.vercel.app
      - key: OTEL_SDK_DISABLED
        value: "true"
      - key: CREWAI_TELEMETRY_OPT_OUT
        value: "true"
